# Ruby LSP configuration
enabledFeatures:
  - codeActions
  - diagnostics
  - documentHighlights
  - documentLink
  - documentSymbols
  - foldingRanges
  - formatting
  - hover
  - inlayHint
  - onTypeFormatting
  - selectionRanges
  - semanticHighlighting
  - completion
  - codeLens
  - definition
  - workspaceSymbol
  - signatureHelp
  - typeHierarchy

# Disable test running completely
disabledFeatures:
  - test

# Test configuration - completely disable
test:
  enabled: false
  framework: none
  autoDetect: false
  runners: []
  reporters: []

# Additional configuration to prevent test detection
featuresConfiguration:
  test:
    enabled: false