name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    name: test (${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [ postgresql, mysql ]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: store_api
          POSTGRES_PASSWORD: userpw
          POSTGRES_DB: store_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_api -d store_api_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: store_api_test
          MYSQL_USER: store_api
          MYSQL_PASSWORD: userpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u store_api -puserpw --silent"
          --health-interval 10s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      RAILS_ENV: test
      DB_ADAPTER: ${{ matrix.database == 'mysql' && 'trilogy' || 'postgresql' }}
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Load database schema
        run: bin/rails db:schema:load

      - name: Run RSpec
        run: bundle exec rspec

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.database }}
          path: coverage/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      - name: Scan gems for known vulnerabilities
        run: bin/bundler-audit check --update

  docker:
    needs: [ test, lint, security ]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: store-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: docker run --rm store-api:ci bin/rails --version
