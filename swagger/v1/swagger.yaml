                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'

  /api/v1/statistics/dashboard:
    get:
      tags:
        - Statistics
      summary: Get dashboard statistics (Admin only)
      description: Get overall dashboard statistics including totals and counts
      responses:
        '200':
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/success_response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total_orders:
                            type: integer
                            example: 150
                          total_revenue:
                            type: number
                            format: decimal
                            example: 45000.00
                          total_products:
                            type: integer
                            example: 25
                          total_customers:
                            type: integer
                            example: 89
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          description: Forbidden - Admin access required

  /api/v1/statistics/inventory:
    get:
      tags:
        - Statistics
      summary: Get inventory statistics (Admin only)
      description: Get inventory-related statistics and analytics
      responses:
        '200':
          description: Inventory statistics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/success_response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          low_stock_products:
                            type: array
                            items:
                              $ref: '#/components/schemas/product'
                          out_of_stock_products:
                            type: array
                            items:
                              $ref: '#/components/schemas/product'
                          total_inventory_value:
                            type: number
                            format: decimal
                            example: 125000.00
                          products_by_brand:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              "Apple": 15
                              "Samsung": 8
                          products_by_category:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              "Smartphones": 20
                              "Accessories": 5
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          description: Forbidden - Admin access required

  /api/v1/statistics/sales:
    get:
      tags:
        - Statistics
      summary: Get sales statistics (Admin only)
      description: Get sales analytics and trends
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: Start date for sales analysis (YYYY-MM-DD)
          example: "2024-01-01"
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: End date for sales analysis (YYYY-MM-DD)
          example: "2024-01-31"
      responses:
        '200':
          description: Sales statistics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/success_response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total_sales:
                            type: number
                            format: decimal
                            example: 15000.00
                          total_orders:
                            type: integer
                            example: 45
                          average_order_value:
                            type: number
                            format: decimal
                            example: 333.33
                          sales_by_day:
                            type: object
                            additionalProperties:
                              type: number
                              format: decimal
                            example:
                              "2024-01-01": 500.00
                              "2024-01-02": 750.00
                          top_customers:
                            type: array
                            items:
                              type: object
                              properties:
                                customer_email:
                                  type: string
                                customer_name:
                                  type: string
                                total_amount:
                                  type: number
                                  format: decimal
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          description: Forbidden - Admin access required
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint
  schemas:
    user:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        role:
          type: string
          enum:
          - customer
          - admin
          example: "customer"
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "iPhone 15 Pro"
        description:
          type: string
          example: "Latest iPhone with advanced features"
        price:
          type: number
          format: decimal
          example: 999.99
        stock_quantity:
          type: integer
          example: 50
        brand_id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 1
        brand:
          $ref: '#/components/schemas/brand'
        category:
          $ref: '#/components/schemas/category'
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/images/iphone15pro.jpg"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    brand:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Apple"
        description:
          type: string
          example: "Technology company"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Smartphones"
        description:
          type: string
          example: "Mobile phones and accessories"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
    cart:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          nullable: true
          example: 1
        session_id:
          type: string
          example: "abc123def456"
        status:
          type: string
          enum:
          - active
          - abandoned
          - completed
          example: "active"
        total_amount:
          type: number
          format: decimal
          example: 299.99
        total_items:
          type: integer
          example: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    cart_item:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cart_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        unit_price:
          type: number
          format: decimal
          example: 99.99
        total_price:
          type: number
          format: decimal
          example: 199.98
        product:
          $ref: '#/components/schemas/product'
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        customer_name:
          type: string
          example: "John Doe"
        customer_email:
          type: string
          format: email
          example: "john@example.com"
        customer_phone:
          type: string
          example: "+1234567890"
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
          example: "pending"
        total_amount:
          type: number
          format: decimal
          example: 299.99
        shipping_address:
          type: string
          example: "123 Main St, City, Country"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    order_item:
      type: object
      properties:
        id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        unit_price:
          type: number
          format: decimal
          example: 99.99
        total_price:
          type: number
          format: decimal
          example: 199.98
        product:
          $ref: '#/components/schemas/product'
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Error message"
        status:
          type: string
          example: "unauthorized"
        errors:
          type: array
          items:
            type: string
          example:
          - "Email can't be blank"
          - "Password is too short"

    success_response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
          example: "Operation completed successfully"
  responses:
    bad_request:
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            allOf:
            - "$ref": "#/components/schemas/error"
            - type: object
              properties:
                status:
                  example: "bad_request"

    unauthorized:
      description: Unauthorized - Invalid or missing authentication
      content:
        application/json:
          schema:
            allOf:
            - "$ref": "#/components/schemas/error"
            - type: object
              properties:
                status:
                  example: "unauthorized"

    not_found:
      description: Resource not found
      content:
        application/json:
          schema:
            allOf:
            - "$ref": "#/components/schemas/error"
            - type: object
              properties:
                status:
                  example: "not_found"

    validation_error:
      description: Validation error - Invalid input data
      content:
        application/json:
          schema:
            allOf:
            - "$ref": "#/components/schemas/error"
            - type: object
              properties:
                status:
                  example: "unprocessable_entity"
                errors:
                  type: array
                  items:
                    type: string
                  example:
                  - "Email can't be blank"
                  - "Password is too short"

    internal_server_error:
      description: Internal server error
      content:
        application/json:
          schema:
            allOf:
            - "$ref": "#/components/schemas/error"
            - type: object
              properties:
                status:
                  example: "internal_server_error"

security:
- bearer_auth: []
