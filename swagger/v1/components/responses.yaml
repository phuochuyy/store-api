bad_request:
  description: Bad request - Invalid parameters
  content:
    application/json:
      schema:
        allOf:
        - "$ref": "#/components/schemas/error"
        - type: object
          properties:
            status:
              example: "bad_request"

unauthorized:
  description: Unauthorized - Invalid or missing authentication
  content:
    application/json:
      schema:
        allOf:
        - "$ref": "#/components/schemas/error"
        - type: object
          properties:
            status:
              example: "unauthorized"

forbidden:
  description: Forbidden - Insufficient permissions
  content:
    application/json:
      schema:
        allOf:
        - "$ref": "#/components/schemas/error"
        - type: object
          properties:
            status:
              example: "forbidden"

not_found:
  description: Resource not found
  content:
    application/json:
      schema:
        allOf:
        - "$ref": "#/components/schemas/error"
        - type: object
          properties:
            status:
              example: "not_found"

validation_error:
  description: Validation error - Invalid input data
  content:
    application/json:
      schema:
        allOf:
        - "$ref": "#/components/schemas/error"
        - type: object
          properties:
            status:
              example: "unprocessable_entity"
            errors:
              type: array
              items:
                type: string
              example:
              - "Email can't be blank"
              - "Password is too short"

internal_server_error:
  description: Internal server error
  content:
    application/json:
      schema:
        allOf:
        - "$ref": "#/components/schemas/error"
        - type: object
          properties:
            status:
              example: "internal_server_error"
