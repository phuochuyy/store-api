# Core schemas
User:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "John Doe"
    email:
      type: string
      format: email
      example: "user@example.com"
    role:
      type: string
      enum: [customer, admin]
      example: "customer"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

Product:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "iPhone 15 Pro"
    description:
      type: string
      example: "The most advanced iPhone"
    price:
      type: string
      example: "999.99"
    stock_quantity:
      type: integer
      example: 50
    in_stock:
      type: boolean
      example: true
    image_url:
      type: string
      nullable: true
      example: "https://example.com/image.jpg"
    brand:
      $ref: '#/Brand'
    category:
      $ref: '#/Category'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

Brand:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Apple"
    description:
      type: string
      example: "Premium smartphones"
    products_count:
      type: integer
      example: 5
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

Category:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Flagship"
    description:
      type: string
      example: "High-end premium smartphones"
    products_count:
      type: integer
      example: 6
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# Cart schemas
Cart:
  type: object
  properties:
    id:
      type: integer
      example: 1
    user_id:
      type: integer
      example: 1
    total_amount:
      type: number
      example: 1999.98
    cart_items:
      type: array
      items:
        $ref: '#/CartItem'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

CartItem:
  type: object
  properties:
    id:
      type: integer
      example: 1
    cart_id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    quantity:
      type: integer
      example: 2
    unit_price:
      type: number
      example: 999.99
    total_price:
      type: number
      example: 1999.98
    product:
      $ref: '#/Product'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# Order schemas
Order:
  type: object
  properties:
    id:
      type: integer
      example: 1
    user_id:
      type: integer
      example: 1
    customer_name:
      type: string
      example: "John Doe"
    customer_email:
      type: string
      format: email
      example: "john@example.com"
    customer_phone:
      type: string
      example: "1234567890"
    status:
      type: string
      enum: [pending, confirmed, shipped, delivered, cancelled]
      example: "pending"
    total_amount:
      type: number
      example: 1999.98
    discount_amount:
      type: number
      example: 200.00
    final_amount:
      type: number
      example: 1799.98
    order_items:
      type: array
      items:
        $ref: '#/OrderItem'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

OrderItem:
  type: object
  properties:
    id:
      type: integer
      example: 1
    order_id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    quantity:
      type: integer
      example: 2
    unit_price:
      type: number
      example: 999.99
    total_price:
      type: number
      example: 1999.98
    product:
      $ref: '#/Product'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# Discount & Promotion schemas
Discount:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Summer Sale"
    description:
      type: string
      example: "20% off all products"
    discount_type:
      type: string
      enum: [percentage, fixed_amount]
      example: "percentage"
    discount_value:
      type: number
      example: 20.0
    minimum_amount:
      type: number
      example: 100.0
    maximum_discount:
      type: number
      example: 50.0
    start_date:
      type: string
      format: date-time
    end_date:
      type: string
      format: date-time
    active:
      type: boolean
      example: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

Promotion:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Buy 2 Get 1 Free"
    description:
      type: string
      example: "Buy 2 items, get 1 free"
    promotion_type:
      type: string
      enum: [percentage, fixed_amount, buy_x_get_y]
      example: "buy_x_get_y"
    promotion_value:
      type: number
      example: 1.0
    minimum_quantity:
      type: integer
      example: 2
    start_date:
      type: string
      format: date-time
    end_date:
      type: string
      format: date-time
    active:
      type: boolean
      example: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# Notification schemas
Notification:
  type: object
  properties:
    id:
      type: integer
      example: 1
    user_id:
      type: integer
      example: 1
    title:
      type: string
      example: "Order Confirmed"
    message:
      type: string
      example: "Your order #123 has been confirmed"
    read:
      type: boolean
      example: false
    notification_type:
      type: string
      enum: [order, promotion, system]
      example: "order"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# Stock Alert schemas
StockAlert:
  type: object
  properties:
    id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    threshold:
      type: integer
      example: 10
    current_stock:
      type: integer
      example: 5
    enabled:
      type: boolean
      example: true
    notification_enabled:
      type: boolean
      example: true
    last_triggered_at:
      type: string
      format: date-time
      nullable: true
    product:
      $ref: '#/Product'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# Payment schemas
PaymentMethod:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Credit Card"
    description:
      type: string
      example: "Visa, MasterCard, American Express"
    payment_type:
      type: string
      enum: [credit_card, debit_card, bank_transfer, digital_wallet, cash_on_delivery]
      example: "credit_card"
    processing_fee_percentage:
      type: number
      example: 2.5
    processing_fee_fixed:
      type: number
      example: 0.30
    enabled:
      type: boolean
      example: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

Payment:
  type: object
  properties:
    id:
      type: integer
      example: 1
    order_id:
      type: integer
      example: 1
    payment_method_id:
      type: integer
      example: 1
    amount:
      type: number
      example: 199.99
    processing_fee:
      type: number
      example: 5.30
    total_amount:
      type: number
      example: 205.29
    status:
      type: string
      enum: [pending, processing, completed, failed, refunded]
      example: "completed"
    payment_reference:
      type: string
      example: "PAY_123456789"
    transaction_id:
      type: string
      nullable: true
      example: "TXN_987654321"
    payment_method:
      $ref: '#/PaymentMethod'
    order:
      $ref: '#/Order'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# Common schemas
Pagination:
  type: object
  properties:
    current_page:
      type: integer
      example: 1
    total_pages:
      type: integer
      example: 2
    total_count:
      type: integer
      example: 12
    per_page:
      type: integer
      example: 10

AuthResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiJ9..."
        user:
          $ref: '#/User'
    message:
      type: string
      example: "Login successful"

ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    error:
      type: string
      example: "Error message"
    status:
      type: string
      example: "error_status"