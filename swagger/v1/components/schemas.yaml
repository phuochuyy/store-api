# Common schemas
user:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "John Doe"
    email:
      type: string
      format: email
      example: "john@example.com"
    role:
      type: string
      enum: [customer, admin]
      example: "customer"
    email_verified_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

product:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "iPhone 15 Pro"
    description:
      type: string
      example: "Latest iPhone with advanced features"
    price:
      type: number
      format: decimal
      example: 999.99
    stock_quantity:
      type: integer
      example: 50
    brand_id:
      type: integer
      example: 1
    category_id:
      type: integer
      example: 1
    brand:
      $ref: '#/brand'
    category:
      $ref: '#/category'
    image_url:
      type: string
      format: uri
      nullable: true
      example: "https://example.com/images/iphone15pro.jpg"
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

brand:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Apple"
    description:
      type: string
      example: "Technology company"
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

category:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Smartphones"
    description:
      type: string
      example: "Mobile phones and accessories"
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

cart:
  type: object
  properties:
    id:
      type: integer
      example: 1
    user_id:
      type: integer
      nullable: true
      example: 1
    session_id:
      type: string
      example: "abc123def456"
    status:
      type: string
      enum: [active, abandoned, completed]
      example: "active"
    total_amount:
      type: number
      format: decimal
      example: 299.99
    total_items:
      type: integer
      example: 3
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

cart_item:
  type: object
  properties:
    id:
      type: integer
      example: 1
    cart_id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    quantity:
      type: integer
      example: 2
    unit_price:
      type: number
      format: decimal
      example: 99.99
    total_price:
      type: number
      format: decimal
      example: 199.98
    product:
      $ref: '#/product'
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

order:
  type: object
  properties:
    id:
      type: integer
      example: 1
    user_id:
      type: integer
      example: 1
    customer_name:
      type: string
      example: "John Doe"
    customer_email:
      type: string
      format: email
      example: "john@example.com"
    customer_phone:
      type: string
      example: "+1234567890"
    status:
      type: string
      enum: [pending, confirmed, shipped, delivered, cancelled, paid, payment_failed, refunded, partially_refunded]
      example: "pending"
    total_amount:
      type: number
      format: decimal
      example: 299.99
    confirmed_at:
      type: string
      format: date-time
      nullable: true
      example: "2024-01-15T11:30:00Z"
    cancelled_at:
      type: string
      format: date-time
      nullable: true
      example: "2024-01-15T12:30:00Z"
    cancellation_reason:
      type: string
      nullable: true
      example: "Customer requested cancellation"
    shipping_address:
      type: string
      example: "123 Main St, City, Country"
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

order_item:
  type: object
  properties:
    id:
      type: integer
      example: 1
    order_id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    quantity:
      type: integer
      example: 2
    unit_price:
      type: number
      format: decimal
      example: 99.99
    total_price:
      type: number
      format: decimal
      example: 199.98
    product:
      $ref: '#/product'
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

discount:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Summer Sale"
    description:
      type: string
      example: "20% off all items"
    discount_type:
      type: string
      enum: [percentage, fixed_amount]
      example: "percentage"
    discount_value:
      type: number
      format: decimal
      example: 20.0
    minimum_amount:
      type: number
      format: decimal
      nullable: true
      example: 100.0
    maximum_discount:
      type: number
      format: decimal
      nullable: true
      example: 50.0
    usage_limit:
      type: integer
      nullable: true
      example: 100
    used_count:
      type: integer
      example: 25
    is_active:
      type: boolean
      example: true
    starts_at:
      type: string
      format: date-time
      example: "2024-06-01T00:00:00Z"
    expires_at:
      type: string
      format: date-time
      example: "2024-08-31T23:59:59Z"
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

promotion:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Buy 2 Get 1 Free"
    description:
      type: string
      example: "Special promotion for selected items"
    promotion_type:
      type: string
      enum: [buy_x_get_y, bulk_discount, free_shipping]
      example: "buy_x_get_y"
    conditions:
      type: object
      example: {"min_quantity": 2, "discount_percentage": 50}
    is_active:
      type: boolean
      example: true
    starts_at:
      type: string
      format: date-time
      example: "2024-06-01T00:00:00Z"
    expires_at:
      type: string
      format: date-time
      example: "2024-08-31T23:59:59Z"
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

payment_method:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Credit Card"
    description:
      type: string
      example: "Visa, MasterCard, American Express"
    gateway_type:
      type: string
      enum: [stripe, paypal, square, manual]
      example: "stripe"
    processing_fee_percentage:
      type: number
      format: decimal
      example: 2.9
    processing_fee_fixed:
      type: number
      format: decimal
      example: 0.30
    is_active:
      type: boolean
      example: true
    supports_refunds:
      type: boolean
      example: true
    supports_partial_refunds:
      type: boolean
      example: true
    gateway_configured:
      type: boolean
      example: true
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

payment:
  type: object
  properties:
    id:
      type: integer
      example: 1
    order_id:
      type: integer
      example: 1
    payment_method_id:
      type: integer
      example: 1
    amount:
      type: number
      format: decimal
      example: 299.99
    processing_fee:
      type: number
      format: decimal
      example: 8.70
    total_amount:
      type: number
      format: decimal
      example: 308.69
    status:
      type: string
      enum: [pending, processing, completed, failed, refunded, partially_refunded]
      example: "completed"
    transaction_id:
      type: string
      nullable: true
      example: "txn_1234567890"
    currency:
      type: string
      example: "USD"
    processed_at:
      type: string
      format: date-time
      nullable: true
      example: "2024-01-15T11:30:00Z"
    failure_reason:
      type: string
      nullable: true
      example: "Insufficient funds"
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

notification:
  type: object
  properties:
    id:
      type: integer
      example: 1
    user_id:
      type: integer
      example: 1
    notification_type:
      type: string
      enum: [order_update, stock_alert, promotion, system]
      example: "order_update"
    title:
      type: string
      example: "Order Status Update"
    message:
      type: string
      example: "Your order #123 has been shipped"
    is_read:
      type: boolean
      example: false
    metadata:
      type: object
      example: {"order_id": 123}
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

stock_alert:
  type: object
  properties:
    id:
      type: integer
      example: 1
    product_id:
      type: integer
      example: 1
    threshold_quantity:
      type: integer
      example: 10
    current_quantity:
      type: integer
      example: 5
    alert_type:
      type: string
      enum: [low_stock, out_of_stock]
      example: "low_stock"
    is_active:
      type: boolean
      example: true
    notified_at:
      type: string
      format: date-time
      nullable: true
      example: "2024-01-15T10:30:00Z"
    created_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"

# Response schemas
success_response:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
    message:
      type: string
      example: "Operation completed successfully"

error:
  type: object
  properties:
    success:
      type: boolean
      example: false
    error:
      type: string
      example: "Error message"
    status:
      type: string
      example: "unauthorized"
    errors:
      type: array
      items:
        type: string
      example:
      - "Email can't be blank"
      - "Password is too short"

pagination:
  type: object
  properties:
    current_page:
      type: integer
      example: 1
    total_pages:
      type: integer
      example: 10
    total_count:
      type: integer
      example: 100
    per_page:
      type: integer
      example: 10
