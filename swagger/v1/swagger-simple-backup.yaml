---
openapi: 3.0.1
info:
  title: Store API V1
  version: v1
  description: RESTful API for an e-commerce store built with Ruby on Rails
  contact:
    name: Store API Support
    email: support@store-api.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
- url: http://localhost:3000
  description: Development server
- url: https://api.store.com
  description: Production server

tags:
- name: Authentication
  description: User authentication and email verification
- name: Health
  description: System health checks
- name: Products
  description: Product catalog management
- name: Brands
  description: Brand management
- name: Categories
  description: Category management

paths:
  # Health endpoints
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is running and healthy
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  message:
                    type: string
                    example: "Phone Store API is running"
                  version:
                    type: string
                    example: "1.0.0"
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    example: "connected"

  # Authentication endpoints
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiJ9..."
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "John Doe"
                          email:
                            type: string
                            example: "user@example.com"
                          role:
                            type: string
                            example: "customer"
                  message:
                    type: string
                    example: "Login successful"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Invalid email or password"
                  status:
                    type: string
                    example: "unauthorized"

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiJ9..."
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "John Doe"
                          email:
                            type: string
                            example: "user@example.com"
                          role:
                            type: string
                            example: "customer"
                  message:
                    type: string
                    example: "Registration successful."
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Validation failed"
                  status:
                    type: string
                    example: "unprocessable_entity"

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get information about the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "John Doe"
                          email:
                            type: string
                            example: "user@example.com"
                          role:
                            type: string
                            example: "customer"
                  message:
                    type: string
                    example: "User information retrieved successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Token missing"
                  status:
                    type: string
                    example: "unauthorized"

  # Product endpoints
  /api/v1/products:
    get:
      tags:
        - Products
      summary: List products
      description: Get a paginated list of products
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: "iPhone 15 Pro"
                            description:
                              type: string
                              example: "The most advanced iPhone"
                            price:
                              type: string
                              example: "999.99"
                            stock_quantity:
                              type: integer
                              example: 50
                            in_stock:
                              type: boolean
                              example: true
                            brand:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: "Apple"
                            category:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: "Flagship"
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          total_pages:
                            type: integer
                            example: 2
                          total_count:
                            type: integer
                            example: 12
                          per_page:
                            type: integer
                            example: 10
                  message:
                    type: string
                    example: "Products retrieved successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Token missing"
                  status:
                    type: string
                    example: "unauthorized"

  /api/v1/products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Get detailed information about a specific product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      product:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "iPhone 15 Pro"
                          description:
                            type: string
                            example: "The most advanced iPhone"
                          price:
                            type: string
                            example: "999.99"
                          stock_quantity:
                            type: integer
                            example: 50
                          in_stock:
                            type: boolean
                            example: true
                  message:
                    type: string
                    example: "Product retrieved successfully"
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Product not found"
                  status:
                    type: string
                    example: "not_found"

  # Brand endpoints
  /api/v1/brands:
    get:
      tags:
        - Brands
      summary: List brands
      description: Get a paginated list of brands
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Brands retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      brands:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: "Apple"
                            description:
                              type: string
                              example: "Premium smartphones"
                            products_count:
                              type: integer
                              example: 5
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          total_pages:
                            type: integer
                            example: 1
                          total_count:
                            type: integer
                            example: 7
                          per_page:
                            type: integer
                            example: 10
                  message:
                    type: string
                    example: "Brands retrieved successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Token missing"
                  status:
                    type: string
                    example: "unauthorized"

  # Category endpoints
  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: List categories
      description: Get a paginated list of categories
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: "Flagship"
                            description:
                              type: string
                              example: "High-end premium smartphones"
                            products_count:
                              type: integer
                              example: 6
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          total_pages:
                            type: integer
                            example: 1
                          total_count:
                            type: integer
                            example: 5
                          per_page:
                            type: integer
                            example: 10
                  message:
                    type: string
                    example: "Categories retrieved successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Token missing"
                  status:
                    type: string
                    example: "unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "user@example.com"
        role:
          type: string
          enum: [customer, admin]
          example: "customer"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "iPhone 15 Pro"
        description:
          type: string
          example: "The most advanced iPhone"
        price:
          type: string
          example: "999.99"
        stock_quantity:
          type: integer
          example: 50
        in_stock:
          type: boolean
          example: true
        brand:
          $ref: '#/components/schemas/Brand'
        category:
          $ref: '#/components/schemas/Category'

    Brand:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Apple"
        description:
          type: string
          example: "Premium smartphones"
        products_count:
          type: integer
          example: 5

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Flagship"
        description:
          type: string
          example: "High-end premium smartphones"
        products_count:
          type: integer
          example: 6

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Error message"
        status:
          type: string
          example: "error_status"
