notifications:
  get:
    tags:
      - Notifications
    summary: List notifications
    description: Get a paginated list of user's notifications
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Notifications retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    notifications:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Notification'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Notifications retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  notification_by_id:
    get::
    tags:
      - Notifications
    summary: Get notification by ID
    description: Get detailed information about a specific notification
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Notification ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Notification retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    notification:
                      $ref: './components/schemas.yaml#/Notification'
                message:
                  type: string
                  example: "Notification retrieved successfully"
      '404':
        description: Notification not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Notifications
    summary: Update notification
    description: Update notification information
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Notification ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                example: "Updated notification title"
              message:
                type: string
                example: "Updated notification message"
              read:
                type: boolean
                example: true
    responses:
      '200':
        description: Notification updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    notification:
                      $ref: './components/schemas.yaml#/Notification'
                message:
                  type: string
                  example: "Notification updated successfully"
      '404':
        description: Notification not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Notifications
    summary: Delete notification
    description: Delete a notification
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Notification ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Notification deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Notification deleted successfully"
      '404':
        description: Notification not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  mark_read:
    post::
    tags:
      - Notifications
    summary: Mark notification as read
    description: Mark a notification as read
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Notification ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Notification marked as read successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Notification marked as read successfully"
      '404':
        description: Notification not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  mark_all_read:
    post::
    tags:
      - Notifications
    summary: Mark all notifications as read
    description: Mark all notifications for the current user as read
    security:
      - bearerAuth: []
    responses:
      '200':
        description: All notifications marked as read successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    updated_count:
                      type: integer
                      example: 5
                message:
                  type: string
                  example: "All notifications marked as read successfully"