statistics:
  get:
    tags:
      - Notifications
    summary: Get notification statistics (Admin only)
    description: Get notification statistics and analytics (Admin access required)
    responses:
      '200':
        description: Notification statistics retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        total_notifications:
                          type: integer
                        unread_count:
                          type: integer
                        notifications_by_type:
                          type: object
                        recent_activity:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/notification'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '403':
        $ref: '../components/responses.yaml#/forbidden'
