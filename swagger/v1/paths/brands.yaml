brands:
  get:
    tags:
      - Brands
    summary: List brands
    description: Get a paginated list of brands
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Brands retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    brands:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Brand'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Brands retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Brands
    summary: Create brand
    description: Create a new brand (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                example: "Apple"
              description:
                type: string
                example: "Premium smartphones"
    responses:
      '201':
        description: Brand created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    brand:
                      $ref: './components/schemas.yaml#/Brand'
                message:
                  type: string
                  example: "Brand created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  brand_by_id:
    get::
    tags:
      - Brands
    summary: Get brand by ID
    description: Get detailed information about a specific brand
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Brand ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Brand retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    brand:
                      $ref: './components/schemas.yaml#/Brand'
                  message:
                    type: string
                    example: "Brand retrieved successfully"
      '404':
        description: Brand not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Brands
    summary: Update brand
    description: Update brand information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Brand ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Apple Inc."
              description:
                type: string
                example: "Updated description"
    responses:
      '200':
        description: Brand updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    brand:
                      $ref: './components/schemas.yaml#/Brand'
                message:
                  type: string
                  example: "Brand updated successfully"
      '404':
        description: Brand not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Brands
    summary: Delete brand
    description: Delete a brand (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Brand ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Brand deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Brand deleted successfully"
      '404':
        description: Brand not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'