categories:
  get:
    tags:
      - Categories
    summary: List categories
    description: Get a paginated list of categories
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Categories retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    categories:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Category'
                    pagination:
                      $ref: '../components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Categories retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Categories
    summary: Create category
    description: Create a new category (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                example: "Flagship"
              description:
                type: string
                example: "High-end premium smartphones"
    responses:
      '201':
        description: Category created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    category:
                      $ref: '../components/schemas.yaml#/Category'
                message:
                  type: string
                  example: "Category created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

category_by_id:
  get:
    tags:
      - Categories
    summary: Get category by ID
    description: Get detailed information about a specific category
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Category ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Category retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    category:
                      $ref: '../components/schemas.yaml#/Category'
                    products:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Product'
                message:
                  type: string
                  example: "Category retrieved successfully"
      '404':
        description: Category not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Categories
    summary: Update category
    description: Update category information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Category ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Premium"
              description:
                type: string
                example: "Updated description"
    responses:
      '200':
        description: Category updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    category:
                      $ref: '../components/schemas.yaml#/Category'
                message:
                  type: string
                  example: "Category updated successfully"
      '404':
        description: Category not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Categories
    summary: Delete category
    description: Delete a category (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Category ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Category deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Category deleted successfully"
      '404':
        description: Category not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'