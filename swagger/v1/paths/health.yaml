health:
  get:
    tags:
      - Health
    summary: Health check
    description: Check if the API is running and healthy
    responses:
      '200':
        description: API is healthy
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: "ok"
                message:
                  type: string
                  example: "Phone Store API is running"
                version:
                  type: string
                  example: "1.0.0"
                timestamp:
                  type: string
                  format: date-time
                database:
                  type: string
                  example: "connected"