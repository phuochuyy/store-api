health:
  get:
    tags:
      - Health
    summary: Health check
    description: Check if the API is running and healthy
    responses:
      '200':
        description: API is healthy
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: "ok"
                message:
                  type: string
                  example: "Phone Store API is running"
                timestamp:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
                version:
                  type: string
                  example: "v1"
                environment:
                  type: string
                  example: "development"
                database:
                  type: string
                  example: "connected"
                  description: "Database connection status"