payments:
  get:
    tags:
      - Payments
    summary: List payments
    description: Get a paginated list of payments
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Payments retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payments:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Payment'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Payments retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Payments
    summary: Create payment
    description: >-
      Pay for an order. Online gateways (stripe, paypal, wallet) settle at once: the payment is
      completed and the order paid. Offline methods (cash_on_delivery, bank_transfer) are paid
      outside the app: the payment stays pending and the order unpaid until an admin confirms the
      money arrived with POST /api/v1/payments/{id}/confirm.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - order_id
              - payment_method_id
              - amount
            properties:
              order_id:
                type: integer
                example: 1
              payment_method_id:
                type: integer
                example: 1
              amount:
                type: number
                example: 199.99
              payment_reference:
                type: string
                example: "PAY_123456789"
    responses:
      '201':
        description: Payment created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment:
                      $ref: './components/schemas.yaml#/Payment'
                message:
                  type: string
                  example: "Payment created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  payment_by_id:
    get::
    tags:
      - Payments
    summary: Get payment by ID
    description: Get detailed information about a specific payment
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Payment retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment:
                      $ref: './components/schemas.yaml#/Payment'
                message:
                  type: string
                  example: "Payment retrieved successfully"
      '404':
        description: Payment not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Payments
    summary: Update payment (admin only)
    description: >-
      Update a payment's annotations. The status and transaction id cannot be set directly
      (422): payments are completed by the gateway, and refunds go through the refund action,
      which keeps the order's payment_status in step.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - payment
            properties:
              payment:
                type: object
                properties:
                  gateway_response:
                    type: string
                    example: '{"reconciled": true}'
                  failure_reason:
                    type: string
                    example: "Card declined"
                  metadata:
                    type: object
                    example: { "note": "Checked with the bank" }
    responses:
      '200':
        description: Payment updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment:
                      $ref: './components/schemas.yaml#/Payment'
                message:
                  type: string
                  example: "Payment updated successfully"
      '404':
        description: Payment not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Payments
    summary: Delete payment
    description: Delete a payment (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Payment deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Payment deleted successfully"
      '404':
        description: Payment not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  refund_payment:
    post::
    tags:
      - Payments
    summary: Process refund
    description: Process a refund for a payment
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              refund_amount:
                type: number
                example: 50.00
              reason:
                type: string
                example: "Customer requested refund"
    responses:
      '200':
        description: Refund processed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    refund:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        payment_id:
                          type: integer
                          example: 1
                        refund_amount:
                          type: number
                          example: 50.00
                        reason:
                          type: string
                          example: "Customer requested refund"
                        status:
                          type: string
                          example: "processed"
                message:
                  type: string
                  example: "Refund processed successfully"
      '404':
        description: Payment not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  confirm_payment:
    post:
      tags:
        - Payments
      summary: Confirm an offline payment was received (admin)
      description: >-
        For cash on delivery and bank transfers: the money arrived, so the pending payment becomes
        completed and the order paid. Refused with 422 for online payments, payments that are not
        pending, and orders that cannot be paid any more (cancelled, or paid another way).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Payment confirmed; the order is paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Payment confirmed"
                  data:
                    type: object
                    properties:
                      payment:
                        $ref: './components/schemas.yaml#/Payment'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/ErrorResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/ErrorResponse'
        '422':
          description: Not a pending offline payment, or the order cannot be paid
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/ErrorResponse'
