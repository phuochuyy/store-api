payments:
  get:
    tags:
      - Payments
    summary: List payments
    description: Get a paginated list of payments
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Payments retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payments:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Payment'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Payments retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Payments
    summary: Create payment
    description: Create a new payment
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - order_id
              - payment_method_id
              - amount
            properties:
              order_id:
                type: integer
                example: 1
              payment_method_id:
                type: integer
                example: 1
              amount:
                type: number
                example: 199.99
              payment_reference:
                type: string
                example: "PAY_123456789"
    responses:
      '201':
        description: Payment created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment:
                      $ref: './components/schemas.yaml#/Payment'
                message:
                  type: string
                  example: "Payment created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  payment_by_id:
    get::
    tags:
      - Payments
    summary: Get payment by ID
    description: Get detailed information about a specific payment
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Payment retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment:
                      $ref: './components/schemas.yaml#/Payment'
                message:
                  type: string
                  example: "Payment retrieved successfully"
      '404':
        description: Payment not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Payments
    summary: Update payment
    description: Update payment information
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [pending, processing, completed, failed, refunded]
                example: "completed"
              payment_reference:
                type: string
                example: "PAY_123456789_UPDATED"
    responses:
      '200':
        description: Payment updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment:
                      $ref: './components/schemas.yaml#/Payment'
                message:
                  type: string
                  example: "Payment updated successfully"
      '404':
        description: Payment not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Payments
    summary: Delete payment
    description: Delete a payment (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Payment deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Payment deleted successfully"
      '404':
        description: Payment not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  refund_payment:
    post::
    tags:
      - Payments
    summary: Process refund
    description: Process a refund for a payment
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              refund_amount:
                type: number
                example: 50.00
              reason:
                type: string
                example: "Customer requested refund"
    responses:
      '200':
        description: Refund processed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    refund:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        payment_id:
                          type: integer
                          example: 1
                        refund_amount:
                          type: number
                          example: 50.00
                        reason:
                          type: string
                          example: "Customer requested refund"
                        status:
                          type: string
                          example: "processed"
                message:
                  type: string
                  example: "Refund processed successfully"
      '404':
        description: Payment not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'