wishlists:
  get:
    tags:
      - Wishlists
    summary: List wishlists
    description: Get all wishlist items for the current user
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: Wishlist retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    wishlists:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/ProductWishlist'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Wishlist retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Wishlists
    summary: Add product to wishlist
    description: Add a product to the current user's wishlist
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - product_id
            properties:
              product_id:
                type: integer
                example: 1
              notes:
                type: string
                example: "Want to buy this later"
              priority:
                type: integer
                default: 0
                example: 1
    responses:
      '201':
        description: Product added to wishlist successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    wishlist:
                      $ref: './components/schemas.yaml#/ProductWishlist'
                message:
                  type: string
                  example: "Product added to wishlist successfully"
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '422':
        description: Unprocessable entity (e.g., product already in wishlist)
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

wishlist_by_id:
  get:
    tags:
      - Wishlists
    summary: Get wishlist item
    description: Get a specific wishlist item by ID
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Wishlist ID
    responses:
      '200':
        description: Wishlist item retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    wishlist:
                      $ref: './components/schemas.yaml#/ProductWishlist'
                message:
                  type: string
                  example: "Wishlist item retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Wishlist item not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Wishlists
    summary: Remove product from wishlist
    description: Remove a product from the current user's wishlist
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Wishlist ID
    responses:
      '200':
        description: Product removed from wishlist successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  nullable: true
                message:
                  type: string
                  example: "Product removed from wishlist successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Forbidden (can only remove own wishlist items)
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Wishlist item not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

wishlists_my_wishlist:
  get:
    tags:
      - Wishlists
    summary: Get my wishlist
    description: Get the current user's wishlist (alias for GET /wishlists)
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: Wishlist retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    wishlists:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/ProductWishlist'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Wishlist retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

