login:
  post:
    tags:
      - Authentication
    summary: User login
    description: Authenticate user with email and password
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
                example: "user@example.com"
              password:
                type: string
                format: password
                example: "password123"
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthResponse'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'
            example:
              success: false
              error: "Invalid email or password"
              status: "unauthorized"

register:
  post:
    tags:
      - Authentication
    summary: User registration
    description: Register a new user account
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
              - password_confirmation
              - first_name
              - last_name
            properties:
              email:
                type: string
                format: email
                example: "user@example.com"
              password:
                type: string
                format: password
                minLength: 6
                example: "password123"
              password_confirmation:
                type: string
                format: password
                example: "password123"
              first_name:
                type: string
                example: "John"
              last_name:
                type: string
                example: "Doe"
              phone:
                type: string
                example: "+1234567890"
    responses:
      '201':
        description: User registered successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthResponse'
      '422':
        description: Validation errors
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

me:
  get:
    tags:
      - Authentication
    summary: Get current user
    description: Get information about the currently authenticated user
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User information retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../components/schemas.yaml#/User'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

logout:
  post:
    tags:
      - Authentication
    summary: User logout
    description: Logout the current user and invalidate the JWT token
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Logged out successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'