login:
  post:
    tags:
      - Authentication
    summary: User login
    description: Authenticate user with email and password
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
                example: "user@example.com"
              password:
                type: string
                format: password
                example: "password123"
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthResponse'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

register:
  post:
    tags:
      - Authentication
    summary: User registration
    description: Register a new user account
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - email
              - password
            properties:
              name:
                type: string
                example: "John Doe"
              email:
                type: string
                format: email
                example: "user@example.com"
              password:
                type: string
                format: password
                example: "password123"
    responses:
      '201':
        description: Registration successful
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthResponse'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

me:
  get:
    tags:
      - Authentication
    summary: Get current user
    description: Get information about the currently authenticated user
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User information retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    user:
                      $ref: '../components/schemas.yaml#/User'
                message:
                  type: string
                  example: "User information retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

logout:
  post:
    tags:
      - Authentication
    summary: User logout
    description: Logout current user and invalidate token
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Logout successful"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'