discounts:
  get:
    tags:
      - Discounts
    summary: List discounts
    description: Get a paginated list of discounts
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Discounts retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    discounts:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Discount'
                    pagination:
                      $ref: '../components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Discounts retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Discounts
    summary: Create discount
    description: Create a new discount (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - discount_type
              - discount_value
            properties:
              name:
                type: string
                example: "Summer Sale"
              description:
                type: string
                example: "20% off all products"
              discount_type:
                type: string
                enum: [percentage, fixed_amount]
                example: "percentage"
              discount_value:
                type: number
                example: 20.0
              minimum_amount:
                type: number
                example: 100.0
              maximum_discount:
                type: number
                example: 50.0
              start_date:
                type: string
                format: date-time
              end_date:
                type: string
                format: date-time
    responses:
      '201':
        description: Discount created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    discount:
                      $ref: '../components/schemas.yaml#/Discount'
                message:
                  type: string
                  example: "Discount created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

discount_by_id:
  get:
    tags:
      - Discounts
    summary: Get discount by ID
    description: Get detailed information about a specific discount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Discount ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Discount retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    discount:
                      $ref: '../components/schemas.yaml#/Discount'
                message:
                  type: string
                  example: "Discount retrieved successfully"
      '404':
        description: Discount not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Discounts
    summary: Update discount
    description: Update discount information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Discount ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Updated Summer Sale"
              description:
                type: string
                example: "Updated description"
              discount_value:
                type: number
                example: 25.0
              active:
                type: boolean
                example: true
    responses:
      '200':
        description: Discount updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    discount:
                      $ref: '../components/schemas.yaml#/Discount'
                message:
                  type: string
                  example: "Discount updated successfully"
      '404':
        description: Discount not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Discounts
    summary: Delete discount
    description: Delete a discount (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Discount ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Discount deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Discount deleted successfully"
      '404':
        description: Discount not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'