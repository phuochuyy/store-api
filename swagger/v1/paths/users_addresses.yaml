users_addresses:
  get:
    tags:
      - User Addresses
    summary: List user addresses
    description: Get all addresses for the current user
    security:
      - bearerAuth: []
    parameters:
      - name: address_type
        in: query
        required: false
        schema:
          type: string
          enum: [billing, shipping, both]
        description: Filter by address type
      - name: is_default
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by default address
    responses:
      '200':
        description: Addresses retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    addresses:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/UserAddress'
                    total_count:
                      type: integer
                      example: 3
                message:
                  type: string
                  example: "Addresses retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - User Addresses
    summary: Create user address
    description: Create a new address for the current user
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - address
            properties:
              address:
                type: object
                required:
                  - street
                  - city
                  - country_code
                properties:
                  street:
                    type: string
                    example: "123 Main St"
                  city:
                    type: string
                    example: "Los Angeles"
                  state:
                    type: string
                    example: "CA"
                  postal_code:
                    type: string
                    example: "90001"
                  country_code:
                    type: string
                    pattern: '^[A-Z]{2}$'
                    example: "US"
                  address_type:
                    type: string
                    enum: [billing, shipping, both]
                    default: both
                    example: "both"
                  is_default:
                    type: boolean
                    default: false
                    example: true
    responses:
      '201':
        description: Address created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    address:
                      $ref: './components/schemas.yaml#/UserAddress'
                message:
                  type: string
                  example: "Address created successfully"
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '422':
        description: Unprocessable entity
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

users_address_by_id:
  get:
    tags:
      - User Addresses
    summary: Get user address
    description: Get a specific address by ID
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Address ID
    responses:
      '200':
        description: Address retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    address:
                      $ref: './components/schemas.yaml#/UserAddress'
                message:
                  type: string
                  example: "Address retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Address not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - User Addresses
    summary: Update user address
    description: Update an address
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Address ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              address:
                type: object
                properties:
                  street:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  postal_code:
                    type: string
                  country_code:
                    type: string
                  address_type:
                    type: string
                    enum: [billing, shipping, both]
                  is_default:
                    type: boolean
    responses:
      '200':
        description: Address updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    address:
                      $ref: './components/schemas.yaml#/UserAddress'
                message:
                  type: string
                  example: "Address updated successfully"
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Forbidden (can only update own addresses)
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Address not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '422':
        description: Unprocessable entity
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - User Addresses
    summary: Delete user address
    description: Delete an address
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Address ID
    responses:
      '200':
        description: Address deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  nullable: true
                message:
                  type: string
                  example: "Address deleted successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Forbidden (can only delete own addresses)
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Address not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

