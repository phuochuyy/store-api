carts:
  get:
    tags:
      - Shopping Cart
    summary: Get user's cart
    description: Retrieve current user's shopping cart
    responses:
      '200':
        description: Cart retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
                        total_items:
                          type: integer
                          example: 5
                        total_amount:
                          type: number
                          format: decimal
                          example: 299.99
      '401':
        $ref: '../components/responses.yaml#/unauthorized'

  post:
    tags:
      - Shopping Cart
    summary: Create new cart
    description: Create a new shopping cart for the user
    responses:
      '201':
        description: Cart created successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'

cart_by_id:
  get:
    tags:
      - Shopping Cart
    summary: Get cart details
    description: Get detailed information about a specific cart
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
    responses:
      '200':
        description: Cart details retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
                        total_items:
                          type: integer
                        total_amount:
                          type: number
                          format: decimal
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'

  put:
    tags:
      - Shopping Cart
    summary: Update cart
    description: Update cart information (e.g., status)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              cart:
                type: object
                properties:
                  status:
                    type: string
                    enum: [active, abandoned, completed]
                    example: "abandoned"
    responses:
      '200':
        description: Cart updated successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'
      '422':
        $ref: '../components/responses.yaml#/validation_error'

  delete:
    tags:
      - Shopping Cart
    summary: Delete cart
    description: Delete a shopping cart
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
    responses:
      '200':
        description: Cart deleted successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'

clear_cart:
  delete:
    tags:
      - Shopping Cart
    summary: Clear cart
    description: Remove all items from the cart
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
    responses:
      '200':
        description: Cart cleared successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'

merge_carts:
  post:
    tags:
      - Shopping Cart
    summary: Merge carts
    description: Merge guest cart with user cart after login
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - guest_session_id
            properties:
              guest_session_id:
                type: string
                description: Session ID of the guest cart
                example: "abc123def456"
    responses:
      '200':
        description: Carts merged successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
      '400':
        $ref: '../components/responses.yaml#/bad_request'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'

cart_items:
  get:
    tags:
      - Shopping Cart
    summary: Get cart items
    description: Get all items in a specific cart
    parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
    responses:
      '200':
        description: Cart items retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
                        total_items:
                          type: integer
                        total_amount:
                          type: number
                          format: decimal
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'

  post:
    tags:
      - Shopping Cart
    summary: Add item to cart
    description: Add a product to the shopping cart
    parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - cart_item
            properties:
              cart_item:
                type: object
                required:
                  - product_id
                properties:
                  product_id:
                    type: integer
                    description: Product ID to add to cart
                    example: 1
                  quantity:
                    type: integer
                    minimum: 1
                    default: 1
                    description: Quantity of the product
                    example: 2
    responses:
      '201':
        description: Item added to cart successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'
      '422':
        $ref: '../components/responses.yaml#/validation_error'

cart_item_by_id:
  get:
    tags:
      - Shopping Cart
    summary: Get cart item
    description: Get details of a specific cart item
    parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Cart item ID
        example: 1
    responses:
      '200':
        description: Cart item retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart_item:
                          $ref: '../components/schemas.yaml#/cart_item'
                        product:
                          $ref: '../components/schemas.yaml#/product'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'

  put:
    tags:
      - Shopping Cart
    summary: Update cart item
    description: Update quantity of a cart item
    parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Cart item ID
        example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - cart_item
            properties:
              cart_item:
                type: object
                required:
                  - quantity
                properties:
                  quantity:
                    type: integer
                    minimum: 0
                    description: New quantity (0 to remove item)
                    example: 3
    responses:
      '200':
        description: Cart item updated successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'
      '422':
        $ref: '../components/responses.yaml#/validation_error'

  delete:
    tags:
      - Shopping Cart
    summary: Remove cart item
    description: Remove a specific item from the cart
    parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: integer
        description: Cart ID
        example: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Cart item ID
        example: 1
    responses:
      '200':
        description: Cart item removed successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        cart:
                          $ref: '../components/schemas.yaml#/cart'
                        cart_items:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/cart_item'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'
