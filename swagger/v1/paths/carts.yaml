carts:
  get:
    tags:
      - Shopping Cart
    summary: Get user's cart
    description: Get the current user's shopping cart
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Cart retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    cart:
                      $ref: '../components/schemas.yaml#/Cart'
                message:
                  type: string
                  example: "Cart retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Shopping Cart
    summary: Create new cart
    description: Create a new shopping cart for the current user
    security:
      - bearerAuth: []
    responses:
      '201':
        description: Cart created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    cart:
                      $ref: '../components/schemas.yaml#/Cart'
                message:
                  type: string
                  example: "Cart created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

cart_by_id:
  delete:
    tags:
      - Shopping Cart
    summary: Delete cart
    description: Delete a shopping cart
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Cart ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Cart deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Cart deleted successfully"
      '404':
        description: Cart not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

clear_cart:
  delete:
    tags:
      - Shopping Cart
    summary: Clear cart
    description: Remove all items from a shopping cart
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Cart ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Cart cleared successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Cart cleared successfully"
      '404':
        description: Cart not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

cart_items:
  post:
    tags:
      - Shopping Cart
    summary: Add item to cart
    description: Add a product to the shopping cart
    security:
      - bearerAuth: []
    parameters:
      - name: cart_id
        in: path
        required: true
        description: Cart ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: integer
                example: 1
              quantity:
                type: integer
                example: 2
    responses:
      '201':
        description: Item added to cart successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    cart_item:
                      $ref: '../components/schemas.yaml#/CartItem'
                message:
                  type: string
                  example: "Item added to cart successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

cart_item_by_id:
  patch:
    tags:
      - Shopping Cart
    summary: Update cart item
    description: Update quantity of a cart item
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Cart Item ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              quantity:
                type: integer
                example: 3
    responses:
      '200':
        description: Cart item updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    cart_item:
                      $ref: '../components/schemas.yaml#/CartItem'
                message:
                  type: string
                  example: "Cart item updated successfully"
      '404':
        description: Cart item not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Shopping Cart
    summary: Remove cart item
    description: Remove an item from the shopping cart
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Cart Item ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Cart item removed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Cart item removed successfully"
      '404':
        description: Cart item not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'