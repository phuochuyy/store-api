                    data:
                      type: object
                      nullable: true
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'
      '422':
        $ref: '../components/responses.yaml#/validation_error'


stock_movements:
  get:
    tags:
      - Products
    summary: Get product stock movements (Admin only)
    description: Get stock movement history for a specific product (Admin access required)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Product ID
        example: 1
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Page number for pagination
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
        description: Number of items per page
    responses:
      '200':
        description: Product stock movements retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        movements:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              movement_type:
                                type: string
                              quantity:
                                type: integer
                              reason:
                                type: string
                              created_at:
                                type: string
                                format: date-time
                        pagination:
                          $ref: '../components/schemas.yaml#/pagination'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '403':
        $ref: '../components/responses.yaml#/forbidden'
      '404':
        $ref: '../components/responses.yaml#/not_found'
