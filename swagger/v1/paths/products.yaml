products:
  get:
    tags:
      - Products
    summary: List products
    description: Get a paginated list of products
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Products retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Product'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Products retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Products
    summary: Create product
    description: Create a new product (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - price
              - stock_quantity
              - brand_id
              - category_id
            properties:
              name:
                type: string
                example: "iPhone 15 Pro"
              description:
                type: string
                example: "The most advanced iPhone"
              price:
                type: string
                example: "999.99"
              stock_quantity:
                type: integer
                example: 50
              brand_id:
                type: integer
                example: 1
              category_id:
                type: integer
                example: 1
    responses:
      '201':
        description: Product created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    product:
                      $ref: './components/schemas.yaml#/Product'
                message:
                  type: string
                  example: "Product created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  product_by_id:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Get detailed information about a specific product
      security:
        - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Product ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Product retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    product:
                      $ref: './components/schemas.yaml#/Product'
                message:
                  type: string
                  example: "Product retrieved successfully"
      '404':
        description: Product not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Products
    summary: Update product
    description: Update product information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Product ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "iPhone 15 Pro Max"
              description:
                type: string
                example: "Updated description"
              price:
                type: string
                example: "1099.99"
              stock_quantity:
                type: integer
                example: 75
    responses:
      '200':
        description: Product updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    product:
                      $ref: './components/schemas.yaml#/Product'
                message:
                  type: string
                  example: "Product updated successfully"
      '404':
        description: Product not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Products
    summary: Delete product
    description: Delete a product (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Product ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Product deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Product deleted successfully"
      '404':
        description: Product not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  search:
    get::
    tags:
      - Products
    summary: Search products
    description: Search products by name or description
    security:
      - bearerAuth: []
    parameters:
      - name: q
        in: query
        required: true
        description: Search query
        schema:
          type: string
          example: "iPhone"
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Search results retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Product'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Search results retrieved successfully"

  upload_image:
    post::
    tags:
      - Products
    summary: Upload product image
    description: Upload an image for a product (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Product ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              image:
                type: string
                format: binary
                description: Product image file
    responses:
      '200':
        description: Image uploaded successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Image uploaded successfully"

  remove_image:
    delete::
    tags:
      - Products
    summary: Remove product image
    description: Remove image from a product (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Product ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Image removed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Image removed successfully"