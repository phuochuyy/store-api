payment_methods:
  get:
    tags:
      - Payment Methods
    summary: List payment methods
    description: Get a paginated list of payment methods
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Payment methods retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment_methods:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/PaymentMethod'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Payment methods retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Payment Methods
    summary: Create payment method
    description: Create a new payment method (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - payment_type
            properties:
              name:
                type: string
                example: "Credit Card"
              description:
                type: string
                example: "Visa, MasterCard, American Express"
              payment_type:
                type: string
                enum: [credit_card, debit_card, bank_transfer, digital_wallet, cash_on_delivery]
                example: "credit_card"
              processing_fee_percentage:
                type: number
                example: 2.5
              processing_fee_fixed:
                type: number
                example: 0.30
              enabled:
                type: boolean
                example: true
    responses:
      '201':
        description: Payment method created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment_method:
                      $ref: './components/schemas.yaml#/PaymentMethod'
                message:
                  type: string
                  example: "Payment method created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  payment_method_by_id:
    get::
    tags:
      - Payment Methods
    summary: Get payment method by ID
    description: Get detailed information about a specific payment method
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment Method ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Payment method retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment_method:
                      $ref: './components/schemas.yaml#/PaymentMethod'
                message:
                  type: string
                  example: "Payment method retrieved successfully"
      '404':
        description: Payment method not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Payment Methods
    summary: Update payment method
    description: Update payment method information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment Method ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Credit Card (Updated)"
              description:
                type: string
                example: "Updated description"
              processing_fee_percentage:
                type: number
                example: 3.0
              enabled:
                type: boolean
                example: false
    responses:
      '200':
        description: Payment method updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment_method:
                      $ref: './components/schemas.yaml#/PaymentMethod'
                message:
                  type: string
                  example: "Payment method updated successfully"
      '404':
        description: Payment method not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Payment Methods
    summary: Delete payment method
    description: Delete a payment method (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment Method ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Payment method deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Payment method deleted successfully"
      '404':
        description: Payment method not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  payment_method_stats:
    get::
    tags:
      - Payment Methods
    summary: Get payment method statistics
    description: Get statistics for a specific payment method (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment Method ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Payment method statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    total_transactions:
                      type: integer
                      example: 150
                    total_amount:
                      type: number
                      example: 25000.00
                    average_transaction:
                      type: number
                      example: 166.67
                    success_rate:
                      type: number
                      example: 98.5
                message:
                  type: string
                  example: "Payment method statistics retrieved successfully"
      '404':
        description: Payment method not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  validate_config:
    post::
    tags:
      - Payment Methods
    summary: Validate payment method configuration
    description: Validate payment method configuration (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Payment Method ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              config:
                type: object
                example: {"api_key": "test_key", "merchant_id": "12345"}
    responses:
      '200':
        description: Configuration validated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    valid:
                      type: boolean
                      example: true
                    message:
                      type: string
                      example: "Configuration is valid"
                message:
                  type: string
                  example: "Configuration validated successfully"
      '404':
        description: Payment method not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  calculate_fees:
    post::
    tags:
      - Payment Methods
    summary: Calculate payment fees
    description: Calculate fees for a payment method
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - payment_method_id
              - amount
            properties:
              payment_method_id:
                type: integer
                example: 1
              amount:
                type: number
                example: 100.00
    responses:
      '200':
        description: Fees calculated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    base_amount:
                      type: number
                      example: 100.00
                    processing_fee:
                      type: number
                      example: 2.80
                    total_amount:
                      type: number
                      example: 102.80
                message:
                  type: string
                  example: "Fees calculated successfully"