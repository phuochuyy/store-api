bulk_operation:
  post:
    tags:
      - Stock Alerts
    summary: Bulk operation on stock alerts (Admin only)
    description: Perform bulk operations on multiple stock alerts (Admin access required)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - operation
              - alert_ids
            properties:
              operation:
                type: string
                enum: [resolve, dismiss, activate, deactivate]
                example: resolve
              alert_ids:
                type: array
                items:
                  type: integer
                example: [1, 2, 3]
    responses:
      '200':
        description: Bulk operation completed successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        processed_count:
                          type: integer
                        results:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/stock_alert'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '403':
        $ref: '../components/responses.yaml#/forbidden'
      '422':
        $ref: '../components/responses.yaml#/validation_error'

