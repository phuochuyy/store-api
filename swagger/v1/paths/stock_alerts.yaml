stock_alerts:
  get:
    tags:
      - Stock Alerts
    summary: Get all stock alerts
    description: Retrieve all stock alerts with pagination
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Page number for pagination
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
        description: Number of items per page
      - name: alert_type
        in: query
        schema:
          type: string
          enum: [low_stock, out_of_stock]
        description: Filter by alert type
      - name: is_active
        in: query
        schema:
          type: boolean
        description: Filter by active status
      - name: product_id
        in: query
        schema:
          type: integer
        description: Filter by product ID
    responses:
      '200':
        description: Stock alerts retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        stock_alerts:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/stock_alert'
                        pagination:
                          $ref: '../components/schemas.yaml#/pagination'
                        summary:
                          type: object
                          properties:
                            total_alerts:
                              type: integer
                            low_stock_count:
                              type: integer
                            out_of_stock_count:
                              type: integer
                            active_alerts:
                              type: integer
      '401':
        $ref: '../components/responses.yaml#/unauthorized'

stock_alert_by_id:
  get:
    tags:
      - Stock Alerts
    summary: Get stock alert details
    description: Get detailed information about a specific stock alert
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Stock alert ID
        example: 1
    responses:
      '200':
        description: Stock alert details retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        stock_alert:
                          $ref: '../components/schemas.yaml#/stock_alert'
                        product:
                          $ref: '../components/schemas.yaml#/product'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '404':
        $ref: '../components/responses.yaml#/not_found'

  put:
    tags:
      - Stock Alerts
    summary: Update stock alert
    description: Update stock alert information (Admin access required)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Stock alert ID
        example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - stock_alert
            properties:
              stock_alert:
                type: object
                properties:
                  threshold_quantity:
                    type: integer
                    minimum: 0
                    description: New threshold quantity
                    example: 15
                  is_active:
                    type: boolean
                    description: Whether the alert is active
                    example: true
    responses:
      '200':
        description: Stock alert updated successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        stock_alert:
                          $ref: '../components/schemas.yaml#/stock_alert'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '403':
        $ref: '../components/responses.yaml#/forbidden'
      '404':
        $ref: '../components/responses.yaml#/not_found'
      '422':
        $ref: '../components/responses.yaml#/validation_error'

  delete:
    tags:
      - Stock Alerts
    summary: Delete stock alert
    description: Delete a specific stock alert (Admin access required)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Stock alert ID
        example: 1
    responses:
      '200':
        description: Stock alert deleted successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '403':
        $ref: '../components/responses.yaml#/forbidden'
      '404':
        $ref: '../components/responses.yaml#/not_found'


