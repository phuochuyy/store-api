stock_alerts:
  get:
    tags:
      - Stock Alerts
    summary: List stock alerts
    description: Get a paginated list of stock alerts
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Stock alerts retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    stock_alerts:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/StockAlert'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Stock alerts retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Stock Alerts
    summary: Create stock alert
    description: Create a new stock alert (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - product_id
              - threshold
            properties:
              product_id:
                type: integer
                example: 1
              threshold:
                type: integer
                example: 10
              enabled:
                type: boolean
                example: true
              notification_enabled:
                type: boolean
                example: true
    responses:
      '201':
        description: Stock alert created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    stock_alert:
                      $ref: './components/schemas.yaml#/StockAlert'
                message:
                  type: string
                  example: "Stock alert created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  stock_alert_by_id:
    get::
    tags:
      - Stock Alerts
    summary: Get stock alert by ID
    description: Get detailed information about a specific stock alert
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Stock Alert ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Stock alert retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    stock_alert:
                      $ref: './components/schemas.yaml#/StockAlert'
                message:
                  type: string
                  example: "Stock alert retrieved successfully"
      '404':
        description: Stock alert not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Stock Alerts
    summary: Update stock alert
    description: Update stock alert information
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Stock Alert ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              threshold:
                type: integer
                example: 10
              enabled:
                type: boolean
                example: true
              notification_enabled:
                type: boolean
                example: true
    responses:
      '200':
        description: Stock alert updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    stock_alert:
                      $ref: './components/schemas.yaml#/StockAlert'
                message:
                  type: string
                  example: "Stock alert updated successfully"
      '404':
        description: Stock alert not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Stock Alerts
    summary: Delete stock alert
    description: Delete a stock alert
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Stock Alert ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Stock alert deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Stock alert deleted successfully"
      '404':
        description: Stock alert not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'