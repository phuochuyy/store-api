users_profile:
  get:
    tags:
      - User Profile
    summary: Get user profile
    description: Get the current user's profile
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Profile retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    profile:
                      $ref: './components/schemas.yaml#/UserProfile'
                message:
                  type: string
                  example: "Profile retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  put:
    tags:
      - User Profile
    summary: Update user profile
    description: Update the current user's profile
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - profile
            properties:
              profile:
                type: object
                properties:
                  name:
                    type: string
                    example: "John Doe"
                  first_name:
                    type: string
                    example: "John"
                  last_name:
                    type: string
                    example: "Doe"
                  phone:
                    type: string
                    example: "+1234567890"
                  gender:
                    type: string
                    enum: [male, female, other]
                  bio:
                    type: string
                    maxLength: 1000
    responses:
      '200':
        description: Profile updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    profile:
                      $ref: './components/schemas.yaml#/UserProfile'
                message:
                  type: string
                  example: "Profile updated successfully"
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '422':
        description: Unprocessable entity
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - User Profile
    summary: Update user profile (partial)
    description: Partially update the current user's profile
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              profile:
                type: object
                properties:
                  name:
                    type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  phone:
                    type: string
                  gender:
                    type: string
                    enum: [male, female, other]
                  bio:
                    type: string
    responses:
      '200':
        description: Profile updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    profile:
                      $ref: './components/schemas.yaml#/UserProfile'
                message:
                  type: string
                  example: "Profile updated successfully"
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '422':
        description: Unprocessable entity
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

users_profile_avatar:
  post:
    tags:
      - User Profile
    summary: Upload profile avatar
    description: Upload a profile avatar image
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - avatar
            properties:
              avatar:
                type: string
                format: binary
                description: Image file (JPEG, PNG, GIF)
    responses:
      '200':
        description: Avatar uploaded successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    profile:
                      $ref: './components/schemas.yaml#/UserProfile'
                message:
                  type: string
                  example: "Avatar uploaded successfully"
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '422':
        description: Unprocessable entity
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - User Profile
    summary: Remove profile avatar
    description: Remove the current user's profile avatar
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Avatar removed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    profile:
                      $ref: './components/schemas.yaml#/UserProfile'
                message:
                  type: string
                  example: "Avatar removed successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

