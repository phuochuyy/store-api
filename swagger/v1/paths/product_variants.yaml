        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Variant not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Products
    summary: Update product variant
    description: Update a variant (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
        description: Product ID
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Variant ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              variant:
                type: object
                properties:
                  name:
                    type: string
                  sku:
                    type: string
                  price:
                    type: number
                    format: decimal
                  stock_quantity:
                    type: integer
                  is_active:
                    type: boolean
                  position:
                    type: integer
                  variant_options_attributes:
                    type: array
                    items:
