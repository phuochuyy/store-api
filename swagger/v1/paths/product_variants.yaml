                          type: boolean
    responses:
      '200':
        description: Variant updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: './components/schemas.yaml#/ProductVariant'
                message:
                  type: string
                  example: "Variant updated successfully"
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Forbidden (Admin only)
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Variant not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Products
    summary: Delete product variant
    description: Delete a variant (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
        description: Product ID
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Variant ID
    responses:
      '200':
        description: Variant deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  nullable: true
                message:
                  type: string
                  example: "Variant deleted successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Forbidden (Admin only)
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Variant not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

