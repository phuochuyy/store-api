promotions:
  get:
    tags:
      - Promotions
    summary: List promotions
    description: Get a paginated list of promotions
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Promotions retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    promotions:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Promotion'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Promotions retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Promotions
    summary: Create promotion
    description: Create a new promotion (Admin only)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - promotion_type
              - promotion_value
            properties:
              name:
                type: string
                example: "Buy 2 Get 1 Free"
              description:
                type: string
                example: "Buy 2 items, get 1 free"
              promotion_type:
                type: string
                enum: [percentage, fixed_amount, buy_x_get_y]
                example: "buy_x_get_y"
              promotion_value:
                type: number
                example: 1.0
              minimum_quantity:
                type: integer
                example: 2
              start_date:
                type: string
                format: date-time
              end_date:
                type: string
                format: date-time
    responses:
      '201':
        description: Promotion created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    promotion:
                      $ref: './components/schemas.yaml#/Promotion'
                message:
                  type: string
                  example: "Promotion created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  promotion_by_id:
    get::
    tags:
      - Promotions
    summary: Get promotion by ID
    description: Get detailed information about a specific promotion
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Promotion ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Promotion retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    promotion:
                      $ref: './components/schemas.yaml#/Promotion'
                message:
                  type: string
                  example: "Promotion retrieved successfully"
      '404':
        description: Promotion not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Promotions
    summary: Update promotion
    description: Update promotion information (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Promotion ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Updated Buy 2 Get 1 Free"
              description:
                type: string
                example: "Updated description"
              promotion_value:
                type: number
                example: 2.0
              active:
                type: boolean
                example: true
    responses:
      '200':
        description: Promotion updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    promotion:
                      $ref: './components/schemas.yaml#/Promotion'
                message:
                  type: string
                  example: "Promotion updated successfully"
      '404':
        description: Promotion not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Promotions
    summary: Delete promotion
    description: Delete a promotion (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Promotion ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Promotion deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Promotion deleted successfully"
      '404':
        description: Promotion not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  stats:
    get::
    tags:
      - Promotions
    summary: Get promotion statistics
    description: Get usage statistics for a specific promotion
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Promotion ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Promotion statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    promotion_id:
                      type: integer
                      example: 1
                    total_applications:
                      type: integer
                      example: 75
                    total_discount_amount:
                      type: number
                      example: 2250.00
                    average_discount_per_order:
                      type: number
                      example: 30.00
                    conversion_rate:
                      type: number
                      example: 15.5
                message:
                  type: string
                  example: "Promotion statistics retrieved successfully"
      '404':
        description: Promotion not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  apply:
    post::
    tags:
      - Promotions
    summary: Apply promotion
    description: Apply a promotion to an order or cart
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Promotion ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - order_id
            properties:
              order_id:
                type: integer
                example: 1
                description: Order ID to apply promotion to
              cart_id:
                type: integer
                example: 1
                description: Cart ID (alternative to order_id)
    responses:
      '200':
        description: Promotion applied successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    promotion:
                      $ref: './components/schemas.yaml#/Promotion'
                    discount_amount:
                      type: number
                      example: 25.00
                    final_amount:
                      type: number
                      example: 125.00
                message:
                  type: string
                  example: "Promotion applied successfully"
      '400':
        description: Promotion cannot be applied
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Promotion not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  applicable:
    get::
    tags:
      - Promotions
    summary: Get applicable promotions
    description: Get promotions that can be applied to current cart or order
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: query
        required: false
        description: Order ID
        schema:
          type: integer
          example: 1
      - name: cart_id
        in: query
        required: false
        description: Cart ID
        schema:
          type: integer
          example: 1
      - name: total_amount
        in: query
        required: false
        description: Total amount for promotion eligibility
        schema:
          type: number
          example: 150.00
    responses:
      '200':
        description: Applicable promotions retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    promotions:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Promotion'
                    total_count:
                      type: integer
                      example: 3
                message:
                  type: string
                  example: "Applicable promotions retrieved successfully"