dashboard:
  get:
    tags:
      - Statistics
    summary: Get dashboard statistics
    description: Get overall system statistics (Admin only)
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Dashboard statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    total_users:
                      type: integer
                      example: 150
                    total_products:
                      type: integer
                      example: 25
                    total_orders:
                      type: integer
                      example: 89
                    total_revenue:
                      type: number
                      example: 12500.50
                    active_discounts:
                      type: integer
                      example: 3
                    active_promotions:
                      type: integer
                      example: 2
                message:
                  type: string
                  example: "Dashboard statistics retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

inventory:
  get:
    tags:
      - Statistics
    summary: Get inventory statistics
    description: Get inventory-related statistics (Admin only)
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Inventory statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    total_products:
                      type: integer
                      example: 25
                    low_stock_products:
                      type: integer
                      example: 3
                    out_of_stock_products:
                      type: integer
                      example: 1
                    total_stock_value:
                      type: number
                      example: 50000.00
                    average_stock_level:
                      type: number
                      example: 45.2
                    top_selling_products:
                      type: array
                      items:
                        type: object
                        properties:
                          product_id:
                            type: integer
                            example: 1
                          product_name:
                            type: string
                            example: "iPhone 15 Pro"
                          total_sold:
                            type: integer
                            example: 15
                message:
                  type: string
                  example: "Inventory statistics retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

sales:
  get:
    tags:
      - Statistics
    summary: Get sales statistics
    description: Get sales-related statistics (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: period
        in: query
        description: Time period for statistics
        required: false
        schema:
          type: string
          enum: [today, week, month, year]
          default: month
    responses:
      '200':
        description: Sales statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    total_sales:
                      type: number
                      example: 12500.50
                    total_orders:
                      type: integer
                      example: 89
                    average_order_value:
                      type: number
                      example: 140.45
                    conversion_rate:
                      type: number
                      example: 3.2
                    top_selling_products:
                      type: array
                      items:
                        type: object
                        properties:
                          product_id:
                            type: integer
                            example: 1
                          product_name:
                            type: string
                            example: "iPhone 15 Pro"
                          total_sold:
                            type: integer
                            example: 15
                          revenue:
                            type: number
                            example: 14999.85
                    sales_by_payment_method:
                      type: array
                      items:
                        type: object
                        properties:
                          payment_method:
                            type: string
                            example: "Credit Card"
                          total_amount:
                            type: number
                            example: 8500.00
                          percentage:
                            type: number
                            example: 68.0
                message:
                  type: string
                  example: "Sales statistics retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'