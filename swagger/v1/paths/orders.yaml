orders:
  get:
    tags:
      - Orders
    summary: Get all orders (Admin only)
    description: Retrieve all orders with pagination (Admin access required)
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Page number for pagination
      - name: per_page
        in: query
        schema:
          type: integer
          default: 10
        description: Number of items per page
    responses:
      '200':
        description: Orders retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        orders:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/order'
                        pagination:
                          $ref: '../components/schemas.yaml#/pagination'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '403':
        $ref: '../components/responses.yaml#/forbidden'

  post:
    tags:
      - Orders
    summary: Create new order
    description: Create a new order with order items
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - order
              - order_items
            properties:
              order:
                type: object
                required:
                  - customer_name
                  - customer_email
                  - customer_phone
                properties:
                  customer_name:
                    type: string
                    example: "John Doe"
                  customer_email:
                    type: string
                    format: email
                    example: "john@example.com"
                  customer_phone:
                    type: string
                    example: "+1234567890"
                  status:
                    type: string
                    enum: [pending, confirmed, shipped, delivered, cancelled]
                    default: pending
                    example: "pending"
              order_items:
                type: array
                items:
                  type: object
                  required:
                    - product_id
                    - quantity
                  properties:
                    product_id:
                      type: integer
                      example: 1
                    quantity:
                      type: integer
                      minimum: 1
                      example: 2
    responses:
      '201':
        description: Order created successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/success_response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        order:
                          $ref: '../components/schemas.yaml#/order'
      '401':
        $ref: '../components/responses.yaml#/unauthorized'
      '422':
        $ref: '../components/responses.yaml#/validation_error'

