orders:
  get:
    tags:
      - Orders
    summary: List orders
    description: Get a paginated list of user's orders
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
    responses:
      '200':
        description: Orders retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    orders:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/Order'
                    pagination:
                      $ref: './components/schemas.yaml#/Pagination'
                message:
                  type: string
                  example: "Orders retrieved successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Orders
    summary: Create order
    description: Create a new order from the current cart
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - customer_name
              - customer_email
            properties:
              customer_name:
                type: string
                example: "John Doe"
              customer_email:
                type: string
                format: email
                example: "john@example.com"
              customer_phone:
                type: string
                example: "1234567890"
    responses:
      '201':
        description: Order created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    order:
                      $ref: './components/schemas.yaml#/Order'
                message:
                  type: string
                  example: "Order created successfully"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  order_by_id:
    get::
    tags:
      - Orders
    summary: Get order by ID
    description: Get detailed information about a specific order
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Order ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Order retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    order:
                      $ref: './components/schemas.yaml#/Order'
                message:
                  type: string
                  example: "Order retrieved successfully"
      '404':
        description: Order not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  confirm_order:
    post::
    tags:
      - Orders
    summary: Confirm order
    description: Confirm an order (Admin only)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Order ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Order confirmed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Order confirmed successfully"
      '404':
        description: Order not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '403':
        description: Admin access required
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  cancel_order:
    post::
    tags:
      - Orders
    summary: Cancel order
    description: Cancel an order
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Order ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Order cancelled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Order cancelled successfully"
      '404':
        description: Order not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  order_item_by_id:
    get::
    tags:
      - Orders
    summary: Get order item by ID
    description: Get detailed information about a specific order item
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Order Item ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Order item retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    order_item:
                      $ref: './components/schemas.yaml#/OrderItem'
                message:
                  type: string
                  example: "Order item retrieved successfully"
      '404':
        description: Order item not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  patch:
    tags:
      - Orders
    summary: Update order item
    description: Update order item information
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Order Item ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              quantity:
                type: integer
                example: 3
    responses:
      '200':
        description: Order item updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    order_item:
                      $ref: './components/schemas.yaml#/OrderItem'
                message:
                  type: string
                  example: "Order item updated successfully"
      '404':
        description: Order item not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  delete:
    tags:
      - Orders
    summary: Delete order item
    description: Delete an order item
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Order Item ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Order item deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Order item deleted successfully"
      '404':
        description: Order item not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  apply_discount:
    post::
    tags:
      - Orders
    summary: Apply discount to order
    description: Apply a discount code to an order
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Order ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - discount_code
            properties:
              discount_code:
                type: string
                example: "SAVE20"
    responses:
      '200':
        description: Discount applied successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    order:
                      $ref: './components/schemas.yaml#/Order'
                message:
                  type: string
                  example: "Discount applied successfully"
      '400':
        description: Invalid discount code
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Order not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  remove_discount:
    delete::
    tags:
      - Orders
    summary: Remove discount from order
    description: Remove applied discount from an order
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Order ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Discount removed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    order:
                      $ref: './components/schemas.yaml#/Order'
                message:
                  type: string
                  example: "Discount removed successfully"
      '404':
        description: Order not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  order_items:
    get::
    tags:
      - Orders
    summary: Get order items
    description: Get all items for a specific order
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        description: Order ID
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Order items retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    order_items:
                      type: array
                      items:
                        $ref: './components/schemas.yaml#/OrderItem'
                message:
                  type: string
                  example: "Order items retrieved successfully"
      '404':
        description: Order not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'

  post:
    tags:
      - Orders
    summary: Add item to order
    description: Add a new item to an existing order
    security:
      - bearerAuth: []
    parameters:
      - name: order_id
        in: path
        required: true
        description: Order ID
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: integer
                example: 1
              quantity:
                type: integer
                example: 2
    responses:
      '201':
        description: Order item created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    order_item:
                      $ref: './components/schemas.yaml#/OrderItem'
                message:
                  type: string
                  example: "Order item created successfully"
      '400':
        description: Invalid request data
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'
      '404':
        description: Order not found
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ErrorResponse'