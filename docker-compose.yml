services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: store_api_development
      POSTGRES_USER: store_api
      POSTGRES_PASSWORD: userpw
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_api -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://store_api:userpw@db:5432/store_api_development
      - DATABASE_HOST=db
      - DATABASE_USERNAME=store_api
      - DATABASE_PASSWORD=userpw
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/rails
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ./bin/docker-entrypoint
    command: ./bin/rails server -b 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
