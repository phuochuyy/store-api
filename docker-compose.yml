# Docker Compose for Development
# This file is for development environment
# Rails server runs locally, only DB and Redis run in containers

services:
  db:
    image: postgres:15
    container_name: store_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: store_api_development
      POSTGRES_USER: store_api
      POSTGRES_PASSWORD: userpw
    ports:
      - "5432:5432"  # Default PostgreSQL port
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_api -d store_api_development"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - store_api_network

  redis:
    image: redis:7-alpine
    container_name: store_api_redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # Default Redis port
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - store_api_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  store_api_network:
    driver: bridge
