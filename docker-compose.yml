services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: store_api_development
      POSTGRES_USER: store_api
      POSTGRES_PASSWORD: userpw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://store_api:userpw@db:5432/store_api_development
      - DATABASE_HOST=db
    volumes:
      - .:/rails
    depends_on:
      - db
      - redis
    command: ./bin/rails server -b 0.0.0.0

volumes:
  postgres_data:
