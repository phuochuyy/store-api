services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: store_api_development
      POSTGRES_USER: store_api
      POSTGRES_PASSWORD: userpw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3000"
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://store_api:userpw@db:5432/store_api_development
      - DATABASE_HOST=db
    volumes:
      - .:/rails
    depends_on:
      - db
    command: ./bin/rails server -b 0.0.0.0

volumes:
  postgres_data:
